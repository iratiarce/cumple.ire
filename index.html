<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            background-color: #dcb38f;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        #main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-top: 2vh;
        }

        #book-container {
            position: relative;
            width: 340px;
            height: 480px;
            perspective: 2000px;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        
        #book-container.open {
            transform: translateX(50%);
        }

        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 6px;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.3);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .page-right {
            background-image: url('4.png');
            z-index: 1;
            background-color: #f7e1d7;
            overflow: hidden;
        }

        .page-flip {
            z-index: 2;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        
        #book-container.open .page-flip {
            transform: rotateY(-180deg);
            box-shadow: -2px 5px 15px rgba(0,0,0,0.3);
        }

        .front, .back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f7e1d7;
        }

        .front {
            background-image: url('1.png');
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 30px;
            z-index: 2;
        }

        .back {
            transform: rotateY(180deg);
            background-image: url('2.png');
            z-index: 1;
        }

        #letter-hitbox {
            position: absolute;
            top: 5%;
            left: 10%;
            width: 80%;
            height: 40%;
            cursor: pointer;
        }

        #letter-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #letter-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .letter-content {
            width: 90%;
            max-width: 450px;
            aspect-ratio: 3/4;
            background-image: url('3.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform: scale(0.8) translateY(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        #letter-modal.active .letter-content {
            transform: scale(1) translateY(0);
        }

        /* --- ESTILO BARROCO / ROMÁNTICO EN ROSAS --- */
        .baroque-btn {
            font-family: 'Brush Script MT', 'Lucida Handwriting', 'Georgia', cursive;
            font-size: 22px;
            font-style: italic;
            color: #880e4f;
            background: linear-gradient(135deg, #fff0f5, #ffb6c1);
            border: 2px solid #d87093;
            border-radius: 12px;
            padding: 8px 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 0 8px rgba(216, 112, 147, 0.4);
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            position: relative;
            z-index: 50;
        }
        .baroque-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.3), inset 0 0 12px rgba(216, 112, 147, 0.6);
            background: linear-gradient(135deg, #ffffff, #ffc9d6);
        }

        /* Botones externos */
        #external-controls {
            display: flex;
            justify-content: center;
            height: 50px;
            z-index: 10;
        }

        /* Botón de soplar */
        #mic-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
        }

        /* Barra de soplido */
        #mic-meter-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            display: none;
            z-index: 10;
            text-align: center;
            transition: opacity 0.5s ease;
        }
        
        #mic-meter-label {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
            font-size: 20px;
            color: #880e4f;
            background: rgba(255,240,245,0.9);
            padding: 2px 15px;
            border-radius: 15px;
            border: 1px solid #d87093;
            display: inline-block;
            margin-bottom: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #mic-meter {
            width: 100%;
            height: 18px;
            background: rgba(255,255,255,0.9);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #d87093;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        
        #mic-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb6c1, #d87093);
            transition: width 0.1s linear;
        }

        /* --- CONFETI REALISTA --- */
        #flames-box {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
        }

        .confetti {
            position: absolute;
            border-radius: 2px;
            pointer-events: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            animation: pop 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            z-index: 50;
        }
        
        @keyframes pop {
            0% { transform: translate(-50%, -50%) rotate3d(1, 1, 1, 0deg) scale(0.5); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) rotate3d(var(--rx), var(--ry), var(--rz), var(--rot)) scale(1); opacity: 0; }
        }

        /* Texto de deseo concedido barroco rosa */
        .wish-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-family: 'Brush Script MT', 'Lucida Handwriting', 'Georgia', cursive;
            font-size: 34px;
            color: #880e4f;
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            padding: 15px 35px;
            border-radius: 20px;
            border: 3px double #d87093;
            font-weight: bold;
            opacity: 0;
            transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2), inset 0 0 10px rgba(216, 112, 147, 0.3);
            pointer-events: none;
            z-index: 20;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
        }
        .wish-text.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        @media (min-width: 800px) {
            #book-container { width: 400px; height: 560px; }
        }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div id="book-container">
            
            <div class="page page-right">
                <button id="mic-btn" class="baroque-btn">Soplar velas</button>
                
                <div id="flames-box"></div>
                
                <div id="mic-meter-container">
                    <div id="mic-meter-label">Sopla fuerte...</div>
                    <div id="mic-meter">
                        <div id="mic-fill"></div>
                    </div>
                </div>

                <div id="wish-text" class="wish-text">¡Deseo concedido!</div>
            </div>

            <div class="page page-flip" id="front-page">
                <div class="front" id="front-cover">
                </div>
                
                <div class="back">
                    <div id="letter-hitbox" title="Toca para leer la carta"></div>
                </div>
            </div>
            
        </div>

        <div id="external-controls">
            <button id="open-btn" class="baroque-btn">Toca para abrir</button>
            <button id="close-btn" class="baroque-btn" style="display: none;">Cerrar tarjeta</button>
        </div>
    </div>

    <div id="letter-modal">
        <div class="letter-content" title="Toca para guardar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const book = document.getElementById('book-container');
            const frontCover = document.getElementById('front-cover');
            
            const openBtn = document.getElementById('open-btn');
            const closeBtn = document.getElementById('close-btn');

            function openCard() {
                book.classList.add('open');
                openBtn.style.display = 'none';
                closeBtn.style.display = 'block';
            }

            function closeCard(e) {
                if(e) e.stopPropagation();
                book.classList.remove('open');
                closeBtn.style.display = 'none';
                openBtn.style.display = 'block';
            }

            openBtn.addEventListener('click', openCard);
            frontCover.addEventListener('click', openCard);
            closeBtn.addEventListener('click', closeCard);

            const letterHitbox = document.getElementById('letter-hitbox');
            const modal = document.getElementById('letter-modal');

            letterHitbox.addEventListener('click', () => {
                modal.classList.add('active');
            });

            modal.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            const micBtn = document.getElementById('mic-btn');
            const micMeterContainer = document.getElementById('mic-meter-container');
            const micFill = document.getElementById('mic-fill');
            const flamesBox = document.getElementById('flames-box');
            const wishText = document.getElementById('wish-text');

            const flamesData = [
                { top: '35%', left: '30%' },
                { top: '35%', left: '37%' },
                { top: '35%', left: '44%' },
                { top: '35%', left: '50%' },
                { top: '35%', left: '57%' },
                { top: '35%', left: '64%' },
                { top: '35%', left: '71%' }
            ];
            
            const confettiColors = [
                'linear-gradient(135deg, #FFD700, #DAA520)',
                'linear-gradient(135deg, #FF6B6B, #C0392B)',
                'linear-gradient(135deg, #6BCB77, #27AE60)',
                'linear-gradient(135deg, #4D96FF, #2980B9)',
                'linear-gradient(135deg, #9D4EDD, #8E44AD)',
                'linear-gradient(135deg, #ffffff, #e0e0e0)'
            ];

            let audioContext;
            let analyser;
            let microphone;
            let isBlowing = false;
            let blowStartTime = 0;
            let hasExploded = false;
            let autoTriggerTimeout;

            micBtn.addEventListener('click', async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.4;

                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);

                    micBtn.style.display = 'none';
                    micMeterContainer.style.display = 'block';
                    
                    autoTriggerTimeout = setTimeout(() => {
                        if (!hasExploded) triggerExplosion();
                    }, 3000); 

                    checkBlowing();

                } catch (err) {
                    micBtn.style.display = 'none';
                    setTimeout(() => {
                        if (!hasExploded) triggerExplosion();
                    }, 2000);
                }
            });

            function checkBlowing() {
                if (hasExploded) return;

                requestAnimationFrame(checkBlowing);
                
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                let average = sum / dataArray.length;
                
                let percent = Math.min(100, (average / 70) * 100);
                micFill.style.width = percent + '%';

                if (average > 50) {
                    if (!isBlowing) {
                        isBlowing = true;
                        blowStartTime = performance.now();
                    } else {
                        const elapsed = performance.now() - blowStartTime;
                        if (elapsed > 300) { 
                            clearTimeout(autoTriggerTimeout); 
                            triggerExplosion();
                        }
                    }
                } else {
                    isBlowing = false;
                }
            }

            function triggerExplosion() {
                if (hasExploded) return;
                hasExploded = true;
                
                micMeterContainer.style.opacity = '0';
                
                flamesData.forEach(pos => {
                    lanzarConfetiRealista(pos.left, pos.top);
                });

                setTimeout(() => {
                    wishText.classList.add('show');
                }, 300);

                setTimeout(() => {
                    wishText.classList.remove('show');
                    
                    setTimeout(() => {
                        hasExploded = false;
                        isBlowing = false;
                        blowStartTime = 0;
                        micFill.style.width = '0%';
                        
                        micBtn.style.display = 'block';
                        micMeterContainer.style.display = 'none';
                        micMeterContainer.style.opacity = '1'; 
                    }, 600);
                    
                }, 5000);
            }

            function lanzarConfetiRealista(left, top) {
                for (let i = 0; i < 30; i++) {
                    const conf = document.createElement('div');
                    conf.className = 'confetti';
                    conf.style.left = left;
                    conf.style.top = top;
                    
                    conf.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                    
                    const width = 6 + Math.random() * 8;
                    const height = width * (1 + Math.random() * 1.5);
                    conf.style.width = width + 'px';
                    conf.style.height = height + 'px';
                    
                    if (Math.random() > 0.6) {
                        conf.style.borderRadius = '50%';
                    }

                    const angle = Math.random() * Math.PI * 2;
                    const velocity = 60 + Math.random() * 120; 
                    const tx = Math.cos(angle) * velocity + 'px';
                    const ty = Math.sin(angle) * velocity + (80 + Math.random() * 50) + 'px'; 
                    
                    const rx = Math.random();
                    const ry = Math.random();
                    const rz = Math.random();
                    const rot = (360 + Math.random() * 1080) + 'deg';
                    
                    conf.style.setProperty('--tx', tx);
                    conf.style.setProperty('--ty', ty);
                    conf.style.setProperty('--rx', rx);
                    conf.style.setProperty('--ry', ry);
                    conf.style.setProperty('--rz', rz);
                    conf.style.setProperty('--rot', rot);
                    
                    flamesBox.appendChild(conf);
                    
                    setTimeout(() => conf.remove(), 1500);
                }
            }

        });
    </script>
</body>
</html>
